<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ナイト・ツアー（オフライン）</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.2rem;
            margin: 5px 0 5px 0;
            color: #fff;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .subtitle {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 10px;
            text-align: center;
        }
        .mode-selector {
            display: flex;
            background: #1e1e1e;
            padding: 3px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #333;
        }
        .mode-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 5px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .mode-btn.active {
            background: #d97706;
            color: #fff;
        }
        .info-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            background: #1e1e1e;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .board-container {
            position: relative;
            background: #2a2a2a;
            padding: 4px;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        .board {
            display: grid;
            gap: 2px;
            width: 88vw;
            max-width: 360px;
            height: 88vw;
            max-height: 360px;
        }
        .cell {
            background-color: #b58863;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            position: relative;
            border-radius: 2px;
        }
        .cell.light { background-color: #f0d9b5; }
        .cell.dark { background-color: #b58863; }
        
        .cell.visited {
            background-color: #4a6b82 !important;
            color: #fff;
        }
        .cell.current {
            background-color: #e63946 !important;
            color: #fff;
        }
        .cell.valid-move::after {
            content: '';
            width: 12px;
            height: 12px;
            background-color: #2a9d8f;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 6px #2a9d8f;
        }
        .cell.hint::before {
            content: '';
            position: absolute;
            inset: 2px;
            border: 3px solid #ffb703;
            border-radius: 2px;
        }
        .number {
            position: absolute;
            font-size: 0.6rem;
            top: 2px;
            left: 3px;
            color: rgba(255,255,255,0.9);
            font-weight: bold;
        }
        .cell.light .number {
            color: rgba(0,0,0,0.7);
        }
        .btn-container {
            display: flex;
            gap: 8px;
            width: 88vw;
            max-width: 360px;
        }
        button.action-btn {
            flex: 1;
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px 4px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        button.action-btn:active {
            background-color: #444;
            transform: scale(0.98);
        }
        button.primary {
            background-color: #2a9d8f;
        }
        #message {
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffb703;
            min-height: 1.2rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1><span>♞</span> Knight's Tour</h1>
    <div class="subtitle">全マス1回ずつ踏破パズル（無音・オフライン）</div>

    <div class="mode-selector">
        <button id="mode-8" class="mode-btn active" onclick="setBoardSize(8)">8×8</button>
        <button id="mode-6" class="mode-btn" onclick="setBoardSize(6)">6×6</button>
    </div>
    
    <div class="info-panel">
        <div>現在の手数: <span id="step-count">0</span>/<span id="total-cells">64</span></div>
        <div>自己ベスト: <span id="best-score">0</span>/<span id="total-cells-best">64</span></div>
    </div>

    <div class="board-container">
        <div id="board" class="board"></div>
    </div>

    <div id="message">好きなマスをタップしてスタート</div>

    <div class="btn-container">
        <button class="action-btn" onclick="undoMove()">1手戻す</button>
        <button class="action-btn" onclick="giveHint()">ヒント</button>
        <button class="action-btn primary" onclick="resetGame()">リセット</button>
    </div>

    <script>
        let BOARD_SIZE = 8;
        let board = [];
        let currentR = -1;
        let currentC = -1;
        let stepCount = 0;
        let historyStack = [];
        let gameStarted = false;
        let gameOver = false;

        const boardEl = document.getElementById('board');
        const stepCountEl = document.getElementById('step-count');
        const bestScoreEl = document.getElementById('best-score');
        const totalCellsEl = document.getElementById('total-cells');
        const totalCellsBestEl = document.getElementById('total-cells-best');
        const messageEl = document.getElementById('message');
        const mode8Btn = document.getElementById('mode-8');
        const mode6Btn = document.getElementById('mode-6');

        const knightMoves = [
            [-2, -1], [-2, 1], [-1, -2], [-1, 2],
            [1, -2], [1, 2], [2, -1], [2, 1]
        ];

        function setBoardSize(size) {
            BOARD_SIZE = size;
            totalCellsEl.textContent = size * size;
            totalCellsBestEl.textContent = size * size;
            
            if (size === 8) {
                mode8Btn.classList.add('active');
                mode6Btn.classList.remove('active');
            } else {
                mode6Btn.classList.add('active');
                mode8Btn.classList.remove('active');
            }
            initGame();
        }

        function initGame() {
            boardEl.style.gridTemplateColumns = `repeat(${BOARD_SIZE}, 1fr)`;
            boardEl.innerHTML = '';
            board = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(0));
            
            currentR = -1;
            currentC = -1;
            stepCount = 0;
            historyStack = [];
            gameStarted = false;
            gameOver = false;
            messageEl.textContent = "好きなマスをタップしてスタート";
            
            let best = localStorage.getItem(`knights_best_${BOARD_SIZE}`) || 0;
            bestScoreEl.textContent = best;

            renderBoard();
        }

        function getValidMoves(r, c) {
            let moves = [];
            for (let [dr, dc] of knightMoves) {
                let nr = r + dr;
                let nc = c + dc;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === 0) {
                    moves.push([nr, nc]);
                }
            }
            return moves;
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            let validMoves = (gameStarted && !gameOver) ? getValidMoves(currentR, currentC) : [];
            let bestMove = (gameStarted && !gameOver) ? getBestWarnsdorffMove(validMoves) : null;

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    
                    if (r === currentR && c === currentC) {
                        cell.classList.add('current');
                        cell.textContent = '♞';
                    } else if (board[r][c] > 0) {
                        cell.classList.add('visited');
                        const numSpan = document.createElement('span');
                        numSpan.className = 'number';
                        numSpan.textContent = board[r][c];
                        cell.appendChild(numSpan);
                    }

                    if (gameStarted && !gameOver && validMoves.some(m => m[0] === r && m[1] === c)) {
                        cell.classList.add('valid-move');
                        if (bestMove && bestMove[0] === r && bestMove[1] === c) {
                            cell.classList.add('hint');
                        }
                    }

                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardEl.appendChild(cell);
                }
            }
            stepCountEl.textContent = stepCount;
        }

        function getBestWarnsdorffMove(validMoves) {
            if (validMoves.length === 0) return null;
            let minDegree = 99;
            let best = validMoves[0];
            for (let move of validMoves) {
                let nextOptions = getValidMoves(move[0], move[1]).length;
                if (nextOptions < minDegree) {
                    minDegree = nextOptions;
                    best = move;
                }
            }
            return best;
        }

        function handleCellClick(r, c) {
            if (gameOver) return;

            if (!gameStarted) {
                currentR = r;
                currentC = c;
                stepCount = 1;
                board[r][c] = stepCount;
                historyStack.push({r, c});
                gameStarted = true;
                messageEl.textContent = "緑のドットのマスをタップして進めよう";
                checkGameStatus();
                renderBoard();
                return;
            }

            let validMoves = getValidMoves(currentR, currentC);
            let isValid = validMoves.some(m => m[0] === r && m[1] === c);

            if (isValid) {
                let prevR = currentR;
                let prevC = currentC;
                currentR = r;
                currentC = c;
                stepCount++;
                board[r][c] = stepCount;
                historyStack.push({r, c});
                
                checkGameStatus();
                renderBoard();
            } else {
                messageEl.textContent = "そこにはナイトのL字で移動できません！";
                setTimeout(() => {
                    if (!gameOver) messageEl.textContent = "緑のドットのマスをタップして進めよう";
                }, 1200);
            }
        }

        function checkGameStatus() {
            let validMoves = getValidMoves(currentR, currentC);
            let totalCells = BOARD_SIZE * BOARD_SIZE;

            updateBestScore(stepCount);

            if (stepCount === totalCells) {
                gameOver = true;
                messageEl.textContent = "🎉 パーフェクトクリアおめでとうございます！";
            } else if (validMoves.length === 0) {
                gameOver = true;
                messageEl.textContent = `ゲームオーバー（スコア: ${stepCount}/${totalCells}）`;
            }
        }

        function updateBestScore(score) {
            let key = `knights_best_${BOARD_SIZE}`;
            let currentBest = parseInt(localStorage.getItem(key) || 0);
            if (score > currentBest) {
                localStorage.setItem(key, score);
                bestScoreEl.textContent = score;
            }
        }

        function undoMove() {
            if (historyStack.length <= 1 || gameOver) return;
            
            let last = historyStack.pop();
            board[last.r][last.lastC || last.c] = 0;
            
            let prev = historyStack[historyStack.length - 1];
            currentR = prev.r;
            currentC = prev.c;
            stepCount--;
            gameOver = false;
            messageEl.textContent = "1手戻しました";
            renderBoard();
        }

        function giveHint() {
            if (!gameStarted || gameOver) return;
            renderBoard();
            messageEl.textContent = "💡 黄色い枠のマスが安全な最適手です！";
        }

        function resetGame() {
            initGame();
        }

        initGame();
    </script>
</body>
</html>
